  description: "Validating MACE-OFF23 against GFN2-xTB, from equilibrium water to reactive chemistry, and correcting it without retraining."
  reader-mode: true
  navbar:
    background: light
    search: true
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Validation"
        href: p1-validation.qmd
      - text: "Reactive"
        href: p2-reactive.qmd
      - text: "Correction"
        href: p3-correction.qmd
      - text: "Iterative"
        href: p4-iterative.qmd
      - text: "Studies"
        menu:
          - text: "Study 01 — Bias × size"
            href: 01-sweep.qmd
          - text: "Study 02 — Periodicity & temperature"
            href: 02-pbc.qmd
          - text: "Study 03 — Large vacuum droplets"
            href: 03-droplets.qmd
          - text: "Study 04 — Diels–Alder reaction"
            href: 04-diels-alder.qmd
          - text: "Study 05 — MACE-OFF23 surrogate"
            href: 05-mace.qmd
          - text: "Study 06 — kpush scaling"
            href: 06-kpush.qmd
          - text: "Study 07 — Collective-variable scoping"
            href: 07-cv-design.qmd
          - text: "Study 08 — Post-training corrections"
            href: 08-corrections.qmd
      - text: "Research Map"
        href: research-map.qmd
    right:
      - icon: github
        text: Repo
        href: https://github.com/tiangroup-uofa/xtb_metadynamics
  page-footer:
    center: "xTB metadynamics of water · Tian group · [github](https://github.com/tiangroup-uofa/xtb_metadynamics)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    fig-align: center
    tbl-cap-location: bottom
    grid:
      body-width: 880px
